<!doctype html>
<html lang="tr" data-motion="on">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0F1011">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!--app:head-->
    <script>
      /* Hareket tercihi ilk boyamadan önce uygulanır; titreme olmaz. */
      (function () {
        var s = null;
        try { s = localStorage.getItem("bmms-motion"); } catch (e) {}
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        document.documentElement.setAttribute("data-motion", s ? (s === "on" ? "on" : "off") : (reduce ? "off" : "on"));
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--app:body-->
  </body>
</html>

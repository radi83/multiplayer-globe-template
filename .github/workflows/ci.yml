name: CI

on:
  push:
    branches: [main, bmms-kongre]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check (site + worker)
        run: npm run typecheck

      - name: Build + size budget
        run: npm run build

      - name: Validate Cloudflare config
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (desktop + phone)
        run: npm test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

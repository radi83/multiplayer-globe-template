name: CI

on:
  push:
    branches: [main, bmms-kongre]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check (site + worker)
        run: npm run typecheck

      - name: Build + size budget
        run: npm run build

      - name: Validate Cloudflare config
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (desktop + phone)
        run: npm test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  bskn-tr:
    name: bskn.tr
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/bskn-tr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: sites/bskn-tr/.nvmrc
          cache: npm
          cache-dependency-path: sites/bskn-tr/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build + checks
        run: npm run build

      - name: Validate Cloudflare config
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (desktop + tablet + phone)
        run: npm test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bskn-tr-playwright-report
          path: sites/bskn-tr/test-results
          retention-days: 7

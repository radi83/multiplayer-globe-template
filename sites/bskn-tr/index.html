<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F1F1EF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
    <script>
      try{var t=localStorage.getItem("bskn-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}
      document.documentElement.classList.add("js");
    </script>
    <!--HEAD-->
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--BODY-->
  </body>
</html>
